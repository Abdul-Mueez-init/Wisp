name: wisp
description: A WhatsApp-inspired realtime messaging app with embedded AI features.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Env config
  flutter_dotenv: ^5.1.0

  # AI (Gemini primary)
  google_generative_ai: ^0.4.6

  # AI (Groq fallback — no official SDK, plain REST via http)
  http: ^1.2.2

  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500